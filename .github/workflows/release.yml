name: Release

# Tag a commit as v<version> (exactly the pubspec version, e.g. v1.1.7+16)
# and this pipeline verifies, signs, and publishes a GitHub Release with
# the AAB + APK attached. Manual runs default to a dry run (build only,
# artifacts on the workflow run) unless `publish` is set with a tag ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (else dry-run build only)"
        required: false
        default: false
        type: boolean
      tag:
        description: "Release tag for manual publish (e.g. v1.1.7+16)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION"
          test "$TAG_VERSION" = "$PUBSPEC_VERSION"

      # Signing + Firebase material lives in GitHub Secrets (see
      # docs/RELEASE_SECRETS.md); nothing sensitive is in the repo.
      - name: Restore signing and Firebase config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

      - name: Resolve release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            test -n "${{ inputs.tag }}" || { echo "manual publish needs inputs.tag"; exit 1; }
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=dry-run" >> "$GITHUB_ENV"
          fi

      - name: Signed release builds
        run: |
          flutter build appbundle --release
          flutter build apk --release
          bash scripts/android_release_check.sh --check-artifact \
            build/app/outputs/bundle/release/app-release.aab
          bash scripts/android_release_check.sh --check-artifact \
            build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/officialconnect-${RELEASE_TAG}-app-release.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/officialconnect-${RELEASE_TAG}-app-release.apk"
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG" dist/*

      - name: Dry-run artifacts
        if: "!startsWith(github.ref, 'refs/tags/') && !inputs.publish"
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
