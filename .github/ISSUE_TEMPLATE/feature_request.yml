name: Feature request
description: Suggest an improvement or new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before submitting.** Never include credentials, USNs, DOBs,
        family-verification answers, session cookies, portal HTML, or
        screenshots containing personal data.
  - type: input
    id: version
    attributes:
      label: App version / device
      description: The version and device you use today, if relevant.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem (redacted)
      description: What is hard or missing today? Use placeholder data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: What happens today?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I redacted all personal data (no credentials, USNs, DOBs, family-verification answers, cookies, portal HTML, or personal screenshots).
          required: true
