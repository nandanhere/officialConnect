name: Bug report
description: Report something broken in the app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before submitting.** Never include credentials, USNs, DOBs,
        family-verification answers, session cookies, portal HTML, or
        screenshots containing personal data. Reports with personal data will
        be edited or closed.
  - type: input
    id: version
    attributes:
      label: App version
      description: e.g. 1.1.7+16, or the commit if built from source.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS
      description: e.g. Pixel 7, Android 15.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Redacted steps to reproduce
      description: Numbered steps using placeholder data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual outcome
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I redacted all personal data (no credentials, USNs, DOBs, family-verification answers, cookies, portal HTML, or personal screenshots).
          required: true
